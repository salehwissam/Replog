<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>REPLOG</title>
  <defs>
    <radialGradient id="luz" cx="50%" cy="8%" r="85%">
      <stop offset="0" stop-color="#25315a"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="aco" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="0.5" stop-color="#a3aecb"/>
      <stop offset="1" stop-color="#5d6987"/>
    </linearGradient>
    <linearGradient id="face" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="knurl" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#a3aecb"/>
      <path d="M0 0V7M0 0H7" stroke="#2a3557" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#luz)"/>
  <!-- plataforma -->
  <ellipse cx="256" cy="432" rx="190" ry="14" fill="#000" opacity="0.35"/>
  <!-- luvas e barra -->
  <rect x="34" y="242" width="444" height="28" rx="8" fill="url(#aco)"/>
  <rect x="196" y="246" width="120" height="20" rx="4" fill="url(#knurl)"/>
  <!-- anilhas vermelhas (25 kg) -->
  <rect x="78" y="96" width="50" height="320" rx="14" fill="#f0453a"/>
  <rect x="78" y="96" width="50" height="320" rx="14" fill="url(#face)"/>
  <rect x="384" y="96" width="50" height="320" rx="14" fill="#f0453a"/>
  <rect x="384" y="96" width="50" height="320" rx="14" fill="url(#face)"/>
  <!-- anilhas azuis (20 kg) -->
  <rect x="134" y="136" width="38" height="240" rx="11" fill="#3b74ff"/>
  <rect x="134" y="136" width="38" height="240" rx="11" fill="url(#face)"/>
  <rect x="340" y="136" width="38" height="240" rx="11" fill="#3b74ff"/>
  <rect x="340" y="136" width="38" height="240" rx="11" fill="url(#face)"/>
  <!-- colares -->
  <rect x="176" y="214" width="16" height="84" rx="5" fill="#eef1f6"/>
  <rect x="320" y="214" width="16" height="84" rx="5" fill="#eef1f6"/>
</svg>
